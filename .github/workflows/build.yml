name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Если в репозитории лежит zip с исходниками — распаковываем его в _src.
      # Если исходники лежат прямо в корне (есть build.gradle) — zip не нужен.
      - name: Prepare sources
        run: |
          if [ -f build.gradle ]; then
            echo "SRC_DIR=." >> "$GITHUB_ENV"
          else
            ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP" ]; then echo "No source zip and no build.gradle found"; exit 1; fi
            echo "Using $ZIP"
            mkdir -p _src
            unzip -q "$ZIP" -d _src
            # если внутри zip есть общая папка, заходим в неё
            D=$(dirname "$(find _src -maxdepth 3 -name build.gradle | head -n 1)")
            echo "SRC_DIR=$D" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: ${{ env.SRC_DIR }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: flrvisuals
          path: ${{ env.SRC_DIR }}/build/libs/*.jar
